<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>replit</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
  <div class="container-fluid">
    <h1>Mi página de Bootstrap</h1>
    

    <button type="button" class="btn btn-primary">Azul</button>
    <button type="button" class="btn btn-success">Verde</button>
    <button type="button" class="btn btn-danger">Rojo</button>

    <p class="text-start">Izquierda</p>
    <p class="text-center text-danger">Centro</p>
    <p class="text-end">Derecha</p>

    <div class="card" style="width: 18rem;">

      <img
        src="frutas.jpg"
        class="card-img-top"
        alt="Cesta con frutas"
        >

        <ul class="list-group list-group-flush">
          <li class="list-group-item">Manzana</li>
          <li class="list-group-item">Plátano</li>
          <li class="list-group-item">Naranja</li>
        </ul>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
